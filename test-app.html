<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>English Test</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  :root{
    --ink:#1B1F3B;
    --ink-soft:#2E3358;
    --paper:#F7F4EC;
    --gold:#F2B705;
    --coral:#FF6B6B;
    --mint:#3DDC97;
    --line: rgba(247,244,236,0.14);
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  @font-face{ font-family:'sysdisp'; src:local('Arial'); }
  body{
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    background: var(--ink);
    color: var(--paper);
    min-height: 100vh;
    display:flex;
    justify-content:center;
  }
  #app{
    width:100%;
    max-width:480px;
    min-height:100vh;
    display:flex;
    flex-direction:column;
    padding: 20px 18px 40px;
    position:relative;
  }
  .eyebrow{
    font-family:'IBM Plex Mono', monospace;
    letter-spacing: 0.18em;
    text-transform:uppercase;
    font-size:11px;
    color: var(--gold);
    margin-bottom:6px;
  }
  h1{
    font-family: 'Space Grotesk','Inter',sans-serif;
    font-weight:700;
    font-size:28px;
    letter-spacing:-0.01em;
    margin-bottom:8px;
  }
  .sub{
    color: rgba(247,244,236,0.65);
    font-size:14.5px;
    line-height:1.5;
    margin-bottom:28px;
  }
  .screen{ display:none; flex-direction:column; flex:1; animation: fade .35s ease; }
  .screen.active{ display:flex; }
  @keyframes fade{ from{opacity:0; transform:translateY(6px);} to{opacity:1; transform:translateY(0);} }

  .card{
    background: var(--ink-soft);
    border:1px solid var(--line);
    border-radius:16px;
    padding:18px;
  }

  input[type=text]{
    width:100%;
    padding:14px 16px;
    border-radius:12px;
    border:1px solid var(--line);
    background: var(--ink-soft);
    color: var(--paper);
    font-size:16px;
    font-family:inherit;
    margin-bottom:14px;
  }
  input[type=text]::placeholder{ color: rgba(247,244,236,0.4); }
  input[type=text]:focus{ outline:none; border-color: var(--gold); }

  select{
    width:100%;
    padding:14px 16px;
    border-radius:12px;
    border:1px solid var(--line);
    background: var(--ink-soft);
    color: var(--paper);
    font-size:16px;
    font-family:inherit;
    margin-bottom:14px;
  }

  button{
    font-family:inherit;
    cursor:pointer;
    border:none;
  }
  .btn-primary{
    background: var(--gold);
    color: var(--ink);
    font-weight:700;
    font-size:15.5px;
    padding:15px 20px;
    border-radius:12px;
    width:100%;
    transition: transform .15s ease, opacity .15s ease;
  }
  .btn-primary:active{ transform: scale(0.98); }
  .btn-primary:disabled{ opacity:0.4; }
  .btn-secondary{
    background: transparent;
    color: var(--paper);
    border:1px solid var(--line) !important;
    font-size:14.5px;
    padding:13px 18px;
    border-radius:12px;
    width:100%;
    margin-top:10px;
  }

  /* progress */
  .progress-row{
    display:flex;
    align-items:center;
    gap:10px;
    margin-bottom:22px;
  }
  .progress-track{
    flex:1;
    height:6px;
    background: rgba(247,244,236,0.12);
    border-radius:99px;
    overflow:hidden;
  }
  .progress-fill{
    height:100%;
    background: var(--gold);
    border-radius:99px;
    transition: width .3s ease;
  }
  .progress-num{
    font-family:'IBM Plex Mono', monospace;
    font-size:12.5px;
    color: rgba(247,244,236,0.6);
    white-space:nowrap;
  }

  .q-text{
    font-family:'Space Grotesk','Inter',sans-serif;
    font-size:20px;
    font-weight:600;
    line-height:1.4;
    margin-bottom:22px;
  }
  .opt{
    display:flex;
    align-items:center;
    gap:12px;
    padding:15px 16px;
    border-radius:12px;
    border:1px solid var(--line);
    background: var(--ink-soft);
    margin-bottom:10px;
    font-size:15px;
    transition: border-color .15s ease, background .15s ease;
  }
  .opt:active{ transform: scale(0.99); }
  .opt-letter{
    font-family:'IBM Plex Mono', monospace;
    font-size:12px;
    width:24px; height:24px;
    border-radius:50%;
    border:1px solid rgba(247,244,236,0.3);
    display:flex; align-items:center; justify-content:center;
    flex-shrink:0;
  }
  .opt.correct{ border-color: var(--mint); background: rgba(61,220,151,0.12); }
  .opt.wrong{ border-color: var(--coral); background: rgba(255,107,107,0.12); }
  .opt.correct .opt-letter{ background: var(--mint); color: var(--ink); border-color:var(--mint); }
  .opt.wrong .opt-letter{ background: var(--coral); color: var(--ink); border-color:var(--coral); }

  /* result */
  .rank-badge{
    font-family:'IBM Plex Mono', monospace;
    font-size:64px;
    font-weight:700;
    color: var(--gold);
    line-height:1;
    margin: 6px 0 2px;
  }
  .rank-label{
    font-size:13px;
    color: rgba(247,244,236,0.55);
    letter-spacing:0.08em;
    text-transform:uppercase;
    margin-bottom:24px;
  }
  .score-big{
    font-family:'Space Grotesk','Inter',sans-serif;
    font-size:44px;
    font-weight:700;
  }
  .score-of{ color: rgba(247,244,236,0.5); font-size:20px; }

  .stat-row{
    display:flex;
    gap:10px;
    margin: 18px 0 6px;
  }
  .stat{
    flex:1;
    background: var(--ink-soft);
    border:1px solid var(--line);
    border-radius:12px;
    padding:14px;
    text-align:center;
  }
  .stat-val{ font-family:'IBM Plex Mono', monospace; font-size:20px; font-weight:700; }
  .stat-lbl{ font-size:11px; color: rgba(247,244,236,0.5); margin-top:4px; text-transform:uppercase; letter-spacing:0.05em; }

  /* leaderboard */
  .lb-row{
    display:flex;
    align-items:center;
    gap:12px;
    padding:13px 14px;
    border-radius:12px;
    margin-bottom:8px;
    background: var(--ink-soft);
    border:1px solid var(--line);
  }
  .lb-row.me{ border-color: var(--gold); background: rgba(242,183,5,0.08); }
  .lb-pos{
    font-family:'IBM Plex Mono', monospace;
    font-weight:700;
    font-size:15px;
    width:26px;
    color: rgba(247,244,236,0.5);
  }
  .lb-row:nth-child(1) .lb-pos{ color: var(--gold); }
  .lb-row:nth-child(2) .lb-pos{ color: #C9CBD6; }
  .lb-row:nth-child(3) .lb-pos{ color: #D08A52; }
  .lb-name{ flex:1; font-size:14.5px; font-weight:500; }
  .lb-score{ font-family:'IBM Plex Mono', monospace; font-size:14px; color: var(--gold); }

  .empty{
    text-align:center;
    padding: 40px 10px;
    color: rgba(247,244,236,0.5);
    font-size:14px;
  }

  .tabbar{
    display:flex;
    gap:8px;
    margin-bottom:18px;
  }
  .tab{
    flex:1;
    text-align:center;
    padding:10px;
    border-radius:10px;
    font-size:13.5px;
    font-weight:600;
    background: var(--ink-soft);
    border:1px solid var(--line);
    color: rgba(247,244,236,0.6);
  }
  .tab.active{ background: var(--gold); color: var(--ink); border-color: var(--gold); }

  .loading{
    display:flex; align-items:center; justify-content:center;
    flex:1; color: rgba(247,244,236,0.5); font-size:14px;
  }
</style>
</head>
<body>
<div id="app">

  <!-- SCREEN 1: Ism kiritish -->
  <div class="screen active" id="screen-name">
    <div class="eyebrow">English Test</div>
    <h1>Testga xush kelibsiz</h1>
    <p class="sub">Ismingizni kiriting va testni boshlang. Natijangiz umumiy reytingga qo'shiladi.</p>
    <input type="text" id="nameInput" placeholder="Ismingiz va familiyangiz" maxlength="40">
    <button class="btn-primary" id="startBtn">Testni boshlash</button>
    <button class="btn-secondary" id="toLeaderboardBtn">Reytingni ko'rish</button>
  </div>

  <!-- SCREEN 2: Test -->
  <div class="screen" id="screen-quiz">
    <div class="progress-row">
      <div class="progress-track"><div class="progress-fill" id="progressFill"></div></div>
      <div class="progress-num" id="progressNum">1/10</div>
    </div>
    <div class="q-text" id="qText"></div>
    <div id="optsWrap"></div>
  </div>

  <!-- SCREEN 3: Natija -->
  <div class="screen" id="screen-result">
    <div class="eyebrow">Natija</div>
    <div class="score-big"><span id="resultScore">0</span><span class="score-of" id="resultOf">/10</span></div>
    <div class="rank-badge" id="rankBadge">#1</div>
    <div class="rank-label">Umumiy reytingdagi o'rningiz</div>
    <div class="stat-row">
      <div class="stat"><div class="stat-val" id="statCorrect">0</div><div class="stat-lbl">To'g'ri</div></div>
      <div class="stat"><div class="stat-val" id="statWrong">0</div><div class="stat-lbl">Xato</div></div>
      <div class="stat"><div class="stat-val" id="statPercent">0%</div><div class="stat-lbl">Natija</div></div>
    </div>
    <button class="btn-primary" id="viewLbFromResult" style="margin-top:22px;">Reytingni ko'rish</button>
    <button class="btn-secondary" id="retryBtn">Qayta ishlash</button>
  </div>

  <!-- SCREEN 4: Leaderboard -->
  <div class="screen" id="screen-leaderboard">
    <div class="eyebrow">Reyting</div>
    <h1 style="font-size:22px; margin-bottom:18px;">Eng yaxshi natijalar</h1>
    <div id="lbList"></div>
    <button class="btn-secondary" id="backHomeBtn">Bosh sahifaga qaytish</button>
  </div>

</div>

<script>
/* =========================================================
   SAVOLLAR — bu yerga o'zingizning test savollaringizni
   qo'shishingiz mumkin. Har bir savol shu formatda:
   { q: "Savol matni", options: ["A","B","C","D"], correct: 0 }
   correct — to'g'ri javobning options ichidagi tartib raqami (0 dan boshlanadi)
   ========================================================= */
const QUESTIONS = [
  { q: "Choose the correct form: She ___ to school every day.", options: ["go", "goes", "going", "gone"], correct: 1 },
  { q: "What is the past tense of 'write'?", options: ["writed", "wrote", "written", "writing"], correct: 1 },
  { q: "Choose the correct sentence.", options: ["I have 20 years old.", "I am 20 years old.", "I has 20 years old.", "I is 20 years old."], correct: 1 },
  { q: "'Beautiful' is a/an ___.", options: ["noun", "verb", "adjective", "adverb"], correct: 2 },
  { q: "Complete: If it rains, I ___ stay home.", options: ["will", "would", "am", "was"], correct: 0 },
  { q: "Choose the synonym for 'happy'.", options: ["sad", "joyful", "angry", "tired"], correct: 1 },
  { q: "Which word is a preposition?", options: ["quickly", "under", "beautiful", "run"], correct: 1 },
  { q: "Choose the correct plural of 'child'.", options: ["childs", "childes", "children", "childrens"], correct: 2 },
  { q: "'They ___ playing football now.' Fill the gap.", options: ["is", "am", "are", "be"], correct: 2 },
  { q: "Choose the opposite of 'difficult'.", options: ["hard", "easy", "complex", "tough"], correct: 1 }
];

let currentUser = "";
let currentIndex = 0;
let score = 0;
let answered = false;

const screens = {
  name: document.getElementById('screen-name'),
  quiz: document.getElementById('screen-quiz'),
  result: document.getElementById('screen-result'),
  leaderboard: document.getElementById('screen-leaderboard'),
};

function showScreen(name){
  Object.values(screens).forEach(s => s.classList.remove('active'));
  screens[name].classList.add('active');
}

// ---- Telegram WebApp init (agar Telegram ichida ochilsa) ----
try{
  if(window.Telegram && window.Telegram.WebApp){
    Telegram.WebApp.ready();
    Telegram.WebApp.expand();
    const tgUser = Telegram.WebApp.initDataUnsafe?.user;
    if(tgUser){
      const fullName = [tgUser.first_name, tgUser.last_name].filter(Boolean).join(' ');
      if(fullName) document.getElementById('nameInput').value = fullName;
    }
  }
}catch(e){ /* Telegram tashqarisida ochilsa muammo bo'lmaydi */ }

// ---- Storage helper ----
async function safeGet(key, shared){
  try{
    const r = await window.storage.get(key, shared);
    return r ? r.value : null;
  }catch(e){ return null; }
}
async function safeSet(key, value, shared){
  try{ return await window.storage.set(key, value, shared); }
  catch(e){ console.error('storage set failed', e); return null; }
}

// ---- Start flow ----
document.getElementById('startBtn').addEventListener('click', async () => {
  const name = document.getElementById('nameInput').value.trim();
  if(!name){
    document.getElementById('nameInput').style.borderColor = 'var(--coral)';
    return;
  }
  currentUser = name;
  await safeSet('last-name', name, false);
  currentIndex = 0;
  score = 0;
  showScreen('quiz');
  renderQuestion();
});

document.getElementById('toLeaderboardBtn').addEventListener('click', async () => {
  showScreen('leaderboard');
  await renderLeaderboard();
});

// prefill last used name
(async () => {
  const last = await safeGet('last-name', false);
  if(last) document.getElementById('nameInput').value = last;
})();

// ---- Quiz rendering ----
function renderQuestion(){
  answered = false;
  const q = QUESTIONS[currentIndex];
  document.getElementById('qText').textContent = q.q;
  document.getElementById('progressNum').textContent = `${currentIndex+1}/${QUESTIONS.length}`;
  document.getElementById('progressFill').style.width = `${((currentIndex)/QUESTIONS.length)*100}%`;

  const wrap = document.getElementById('optsWrap');
  wrap.innerHTML = '';
  const letters = ['A','B','C','D','E','F'];
  q.options.forEach((opt, i) => {
    const div = document.createElement('div');
    div.className = 'opt';
    div.innerHTML = `<div class="opt-letter">${letters[i]}</div><div>${opt}</div>`;
    div.addEventListener('click', () => selectAnswer(i, div));
    wrap.appendChild(div);
  });
}

function selectAnswer(i, el){
  if(answered) return;
  answered = true;
  const q = QUESTIONS[currentIndex];
  const allOpts = document.querySelectorAll('#optsWrap .opt');

  if(i === q.correct){
    el.classList.add('correct');
    score++;
  } else {
    el.classList.add('wrong');
    allOpts[q.correct].classList.add('correct');
  }

  setTimeout(() => {
    currentIndex++;
    if(currentIndex < QUESTIONS.length){
      renderQuestion();
    } else {
      finishQuiz();
    }
  }, 700);
}

// ---- Finish + save to shared leaderboard ----
async function finishQuiz(){
  document.getElementById('progressFill').style.width = '100%';

  const percent = Math.round((score / QUESTIONS.length) * 100);
  document.getElementById('resultScore').textContent = score;
  document.getElementById('resultOf').textContent = `/${QUESTIONS.length}`;
  document.getElementById('statCorrect').textContent = score;
  document.getElementById('statWrong').textContent = QUESTIONS.length - score;
  document.getElementById('statPercent').textContent = `${percent}%`;

  // Natijani umumiy (shared) reytingga saqlash
  const entry = { name: currentUser, score, total: QUESTIONS.length, percent, ts: Date.now() };
  const key = `score:${currentUser}:${Date.now()}`;
  await safeSet(key, JSON.stringify(entry), true);

  const rank = await computeRank(entry);
  document.getElementById('rankBadge').textContent = `#${rank}`;

  showScreen('result');
}

async function getAllScores(){
  try{
    const list = await window.storage.list('score:', true);
    if(!list || !list.keys) return [];
    const entries = [];
    for(const k of list.keys){
      const r = await safeGet(k, true);
      if(r){
        try{ entries.push(JSON.parse(r)); }catch(e){}
      }
    }
    return entries;
  }catch(e){
    console.error('leaderboard fetch failed', e);
    return [];
  }
}

async function computeRank(myEntry){
  const all = await getAllScores();
  // har bir o'quvchining eng yaxshi natijasini olish
  const best = {};
  all.forEach(e => {
    if(!best[e.name] || e.percent > best[e.name].percent){
      best[e.name] = e;
    }
  });
  const list = Object.values(best).sort((a,b) => b.percent - a.percent || a.ts - b.ts);
  const idx = list.findIndex(e => e.name === myEntry.name && e.ts === myEntry.ts);
  return idx >= 0 ? idx + 1 : list.length;
}

async function renderLeaderboard(){
  const lbList = document.getElementById('lbList');
  lbList.innerHTML = '<div class="loading">Yuklanmoqda...</div>';

  const all = await getAllScores();
  const best = {};
  all.forEach(e => {
    if(!best[e.name] || e.percent > best[e.name].percent){
      best[e.name] = e;
    }
  });
  const list = Object.values(best).sort((a,b) => b.percent - a.percent || a.ts - b.ts);

  if(list.length === 0){
    lbList.innerHTML = '<div class="empty">Hozircha hech kim test ishlamagan.<br>Birinchi bo\'ling!</div>';
    return;
  }

  lbList.innerHTML = '';
  list.slice(0, 50).forEach((e, i) => {
    const row = document.createElement('div');
    row.className = 'lb-row' + (e.name === currentUser ? ' me' : '');
    row.innerHTML = `
      <div class="lb-pos">${i+1}</div>
      <div class="lb-name">${e.name}</div>
      <div class="lb-score">${e.score}/${e.total} · ${e.percent}%</div>
    `;
    lbList.appendChild(row);
  });
}

// ---- Navigation buttons ----
document.getElementById('viewLbFromResult').addEventListener('click', async () => {
  showScreen('leaderboard');
  await renderLeaderboard();
});
document.getElementById('retryBtn').addEventListener('click', () => {
  currentIndex = 0;
  score = 0;
  showScreen('quiz');
  renderQuestion();
});
document.getElementById('backHomeBtn').addEventListener('click', () => {
  showScreen('name');
});
</script>
</body>
</html>
